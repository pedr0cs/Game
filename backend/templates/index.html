<!DOCTYPE html>
<html>
<head>
    <title>Game</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #0a0a0f; }
        canvas { display: block; }
    </style>
</head>
<body>
   <canvas id="canvas" style="display: block;"></canvas>
    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let posJogador = {x: 175, y: 175};
    let posInimigo = {x: 300, y: 300};
    let hpInimigo = 3;
    let xp = 0;
    let xpProximoNivel = 10;
    let nivel = 1;
    let velocidadeInimigo = 1;
    let ultimoAtaque = 0;
    const cooldownAtaque = 500;
    let danoProjetil = 1;
    let velocidadeProjetil = 5;
    let cooldownAtual = 500;
    let pausado = false;
    let projeteis = [];
    const teclas = {cima: false, baixo: false, esquerda: false, direita: false}

    const upgrades = [
    { nome: 'Ataque mais rápido', descricao: 'Cooldown reduzido em 100ms', efeito: () => { cooldownAtual = Math.max(100, cooldownAtual - 100); } },
    { nome: 'Projétil mais veloz', descricao: 'Velocidade do projétil +2', efeito: () => { velocidadeProjetil += 2; } },
    { nome: 'Mais dano', descricao: 'Inimigo morre mais rápido', efeito: () => { danoProjetil += 1; } },
    { nome: 'Movimento mais rápido', descricao: 'Velocidade do jogador +2', efeito: () => { velocidadeJogador += 2; } },
];

let velocidadeJogador = 5;

function mostrarUpgrades() {
    pausado = true;
    const sorteados = [...upgrades].sort(() => Math.random() - 0.5).slice(0, 3);

    let modal = document.getElementById('modal-upgrade');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'modal-upgrade';
        modal.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px;
            background: rgba(0,0,0,0.75); z-index: 10;
            font-family: monospace; color: white;
        `;
        document.body.appendChild(modal);
    }

    modal.innerHTML = `
        <h2 style="font-size: 1.8rem; margin-bottom: 8px;">NÍVEL ${nivel}!</h2>
        <p style="color: #aaa; margin-bottom: 16px;">Escolha um upgrade:</p>
        ${sorteados.map((u, i) => `
            <button data-i="${i}" style="
                background: #1a1a2e; border: 1px solid #5050ff;
                color: white; font-family: monospace; font-size: 1rem;
                padding: 16px 32px; width: 300px; cursor: pointer;
                border-radius: 4px; text-align: left;
            ">
                <strong>${u.nome}</strong><br>
                <span style="color: #aaa; font-size: 0.85rem;">${u.descricao}</span>
            </button>
        `).join('')}
    `;

    modal.querySelectorAll('button').forEach((btn, i) => {
        btn.onmouseenter = () => btn.style.background = '#2a2a4e';
        btn.onmouseleave = () => btn.style.background = '#1a1a2e';
        btn.onclick = () => {
            sorteados[i].efeito();
            modal.remove();
            pausado = false;
            requestAnimationFrame(gameLoop);
        };
    });
}

    function desenhar() {
        if (!posJogador || !posInimigo) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'black';
        ctx.fillRect(posJogador.x, posJogador.y, 30, 30);
        ctx.fillStyle = 'red';
        ctx.fillRect(posInimigo.x, posInimigo.y, 30, 30);
        ctx.fillStyle = 'blue';
        for (let p of projeteis) {
            ctx.fillRect(p.x, p.y, 8, 8);
        }
        ctx.fillStyle = '#333';
        ctx.fillRect(20, canvas.height - 30, canvas.width - 40, 14);
        ctx.fillStyle = '#8080ff';
        ctx.fillRect(20, canvas.height - 30, (canvas.width - 40) * (xp / xpProximoNivel), 14);
        ctx.fillStyle = 'white';
        ctx.font = '12px monospace';
        ctx.fillText('NV ' + nivel, 20, canvas.height - 38);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'w' || e.key === 'ArrowUp') teclas.cima = true;
        if (e.key === 's' || e.key === 'ArrowDown') teclas.baixo = true;
        if (e.key === 'a' || e.key === 'ArrowLeft') teclas.esquerda = true;
        if (e.key === 'd' || e.key === 'ArrowRight') teclas.direita = true;
    });

    document.addEventListener('keyup', function(e) {
        if (e.key === 'w' || e.key === 'ArrowUp') teclas.cima = false;
        if (e.key === 's' || e.key === 'ArrowDown') teclas.baixo = false;
        if (e.key === 'a' || e.key === 'ArrowLeft') teclas.esquerda = false;
        if (e.key === 'd' || e.key === 'ArrowRight') teclas.direita = false;
    });

    function gameOver() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px monospace';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 60);
        ctx.font = '20px monospace';
        ctx.fillText('NV ' + nivel + '  |  XP ' + xp, canvas.width/2, canvas.height/2 - 20);

        ctx.fillStyle = '#5050ff';
        ctx.fillRect(canvas.width/2 - 140, canvas.height/2 + 20, 120, 40);
        ctx.fillStyle = 'white';
        ctx.font = '14px monospace';
        ctx.fillText('INICIO', canvas.width/2 - 80, canvas.height/2 + 46);

        ctx.fillStyle = '#336633';
        ctx.fillRect(canvas.width/2 + 20, canvas.height/2 + 20, 120, 40);
        ctx.fillStyle = 'white';
        ctx.fillText('RETRY', canvas.width/2 + 80, canvas.height/2 + 46);

        canvas.onclick = function(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (mx > canvas.width/2 - 140 && mx < canvas.width/2 - 20 &&
                my > canvas.height/2 + 20 && my < canvas.height/2 + 60) {
                window.location.href = 'http://localhost:5000/inicio';
            }

            if (mx > canvas.width/2 + 20 && mx < canvas.width/2 + 140 &&
                my > canvas.height/2 + 20 && my < canvas.height/2 + 60) {
                posJogador = {x: 175, y: 175};
                posInimigo = {x: 300, y: 300};
                hpInimigo = 3;
                xp = 0;
                nivel = 1;
                xpProximoNivel = 10;
                velocidadeInimigo = 1;
                projeteis = [];
                ctx.textAlign = 'left';
                canvas.onclick = null;
                requestAnimationFrame(gameLoop);
            }
        };
        canvas.onmousemove = function(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if ((mx > canvas.width/2 - 140 && mx < canvas.width/2 - 20 &&
                my > canvas.height/2 + 20 && my < canvas.height/2 + 60) ||
                (mx > canvas.width/2 + 20 && mx < canvas.width/2 + 140 &&
                my > canvas.height/2 + 20 && my < canvas.height/2 + 60)) {
                canvas.style.cursor = 'pointer';
            } else {
                canvas.style.cursor = 'default';
            }
        };
    }

    function gameLoop(agora) {

        if (pausado) return;
        let dx = 0, dy = 0;
        if (teclas.cima) dy = -velocidadeJogador;
        if (teclas.baixo) dy = velocidadeJogador;
        if (teclas.esquerda) dx = -velocidadeJogador;
        if (teclas.direita) dx = velocidadeJogador;

        if (dx !== 0 || dy !== 0) {
            posJogador.x = Math.max(0, Math.min(posJogador.x + dx, canvas.width - 30));
            posJogador.y = Math.max(0, Math.min(posJogador.y + dy, canvas.height - 30));
        }

        if (posInimigo.x < posJogador.x) posInimigo.x += velocidadeInimigo;
        else if (posInimigo.x > posJogador.x) posInimigo.x -= velocidadeInimigo;

        if (posInimigo.y < posJogador.y) posInimigo.y += velocidadeInimigo;
        else if (posInimigo.y > posJogador.y) posInimigo.y -= velocidadeInimigo;

        if (Math.abs(posInimigo.x - posJogador.x) < 30 &&
            Math.abs(posInimigo.y - posJogador.y) < 30) {
            desenhar();
            gameOver();
            return;
        }

        if (agora - ultimoAtaque > cooldownAtaque) {
            ultimoAtaque = agora;
            projeteis.push({
                x: posJogador.x + 15,
                y: posJogador.y + 15,
                dx: posInimigo.x - posJogador.x,
                dy: posInimigo.y - posJogador.y
            });
        }

        for (let i = projeteis.length - 1; i >= 0; i--) {
            let p = projeteis[i];
            let dist = Math.sqrt(p.dx * p.dx + p.dy * p.dy);
            p.x += (p.dx / dist) * velocidadeProjetil;
            p.y += (p.dy / dist) * velocidadeProjetil;

            if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                projeteis.splice(i, 1);
                continue;
            }

                        if (p.x > posInimigo.x && p.x < posInimigo.x + 30 &&
                p.y > posInimigo.y && p.y < posInimigo.y + 30) {
                projeteis.splice(i, 1);
                hpInimigo -= danoProjetil;
                if (hpInimigo <= 0) {
                    posInimigo = {x: 300, y: 300};
                    hpInimigo = 3;
                    xp += 1;
                    if (xp >= xpProximoNivel) {
                        xp = 0;
                        nivel += 1;
                        xpProximoNivel = nivel * 10;
                        velocidadeInimigo += 1;
                        mostrarUpgrades();
                        return;
                    }
                }
            }
        }

        desenhar();
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
